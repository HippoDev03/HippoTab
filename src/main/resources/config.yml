# =========================================================================
# Nick subsystem (identity: nickname + display rank + skin)
# =========================================================================
storage:
  type: file
  file:
    name: nick-data.yml
  mariadb:
    host: 127.0.0.1
    port: 3306
    database: hipponick
    username: root
    password: ''
    ssl: false
    pool-size: 10

nick:
  # Master switch for the whole nick subsystem (nick commands, GUIs, skins, profile
  # rewrite, storage, %hipponick_*% placeholders, action bar, LuckPerms ranks).
  # Set to false on servers that only want the tab list / nametag — the overhead
  # nametag (see the `nametag` section) keeps working without nick. Changing this
  # requires a full restart.
  enabled: true
  # Block nicking to a name that belongs to a REAL premium Mojang account (looked up
  # asynchronously), so players cannot impersonate genuine accounts. Players with the
  # permission `hipponick.nick.premium` (OP by default) bypass this. If the Mojang
  # lookup fails (e.g. their API is down), the nick is allowed so nobody gets locked out.
  block-premium-names: true
  # A player's OVERHEAD nameplate is built by the client from the GameProfile
  # name + scoreboard team prefix/suffix, so the only way to put a nick above the
  # head is to rewrite the profile name in packets. Keep these ENABLED.
  #   - packet-name: rewrites the profile name shown to clients -> the nick.
  #   - tab-list:    runs the packet listener applying that rewrite to
  #                  PLAYER_INFO / scores / tab completion.
  tab-list:
    enabled: true
  packet-name:
    enabled: true
    fallback-to-real: true
  skin:
    enabled: true
    source: nickname
    fixed-name: Notch
    fallback-to-real: true
  actionbar:
    enabled: true
    interval-ticks: 10
  # /nick rank-selection GUI. The title lives in messages.yml (gui.rank.title).
  gui:
    rank:
      # Inventory height (1-6 rows).
      rows: 6
      # Item shown for each rank (any Bukkit material name).
      item-material: NAME_TAG
      # Show a "clear nick" button in the last slot.
      show-clear: true
      clear-material: BARRIER
      # Only let players pick ranks at or below their own LuckPerms weight.
      restrict-by-weight: true
    # /realname admin GUI (titles/labels live in messages.yml gui.realname.*).
    realname:
      rows: 6
      empty-material: BARRIER

# Overhead nametag (the name above a player's head). Owned by the nick subsystem:
# each player is put in a per-player scoreboard team (via PacketEvents) whose
# member entry is the SAME name the client sees, so the rank prefix/colour always
# attach — for nicked and non-nicked players alike.
nametag:
  enabled: true
  # Shown BEFORE the name. Supports PlaceholderAPI, MiniMessage (<red>) and legacy
  # (&c) colours. The player name takes the LAST colour in this prefix.
  prefix: "%hipponick_prefix%<gray>"
  # Shown AFTER the name.
  suffix: ""
  # Whether players can push/collide with each other. Each player has their own
  # scoreboard team, so this acts as a global player-collision switch.
  #   true  = vanilla behaviour (players push each other)
  #   false = players pass through each other (no pushing)
  push-players: true
  # How often (ticks) to refresh teams so rank/prefix changes are picked up.
  update-interval-ticks: 20

# =========================================================================
# Tab list / sorting / belowname / sidebar / redis
# =========================================================================
update-interval-ticks: 40

tab:
  enabled: true
  header:
    - "<gradient:#63d471:#233329><bold>Hippo Network</bold></gradient>"
    - "&7Welcome, &f%player_name%"
  footer:
    - "&7Online: &f%server_online%"
    - "&7Store: <yellow>store.example.com</yellow>"
  # Use %player_displayname% so nicknames show here (falls back to the real name).
  player-list-name: "%vaultunlocked_prefix% &f%player_displayname%"
  # If this resolves to true/1/yes/on for a player, hide them from the tab list.
  hide-player-if: ""

sorting:
  enabled: true
  rank-placeholder: "%vaultunlocked_weight%"
  descending: false
  default-rank: 0

belowname:
  enabled: true
  # Update interval in ticks. Lower = more responsive in PvP but heavier.
  update-interval-ticks: 4
  # Static objective title shown above the below-name value.
  title: "<red>❤"
  # Numeric fallback value (still required by scoreboard internals).
  value: "%player_health%"
  # Fancy text value shown instead of the raw number on modern Paper versions.
  fancy-value: "<red>%player_health%"
  # Used when fancy-value resolves to empty.
  fancy-value-default: "<gray>NPC"
  # Optional: disable in specific conditions
  disable-condition: ""

scoreboard:
  enabled: false
  update-interval-ticks: 20
  hide-number: false
  title: " Hippo Network "
  lines:
    - ""
    - " Testing FFA scoreboard "
    - ""
    - " danielchen.me "

redis-sync:
  enabled: false
  host: "127.0.0.1"
  port: 6379
  username: ""
  password: ""
  database: 0
  key-prefix: "hippotab:tab-sync"
  # Leave blank to auto-use this server port (server-25565, etc)
  server-id: ""
  # Redis publish + fetch interval in ticks.
  publish-interval-ticks: 40
  # How long each server entry stays alive if it stops publishing.
  entry-ttl-seconds: 30
  velocity-registry:
    enabled: false
    online-set-key: "hippotab:velocity:online"
    profiles-hash-key: "hippotab:velocity:profiles"
    require-profile: true
    required-permission: ""
    use-profile-prefix-for-team: true
    use-profile-weight-for-sorting: true
  team-sync:
    enabled: false
    ignore-packet-errors: true

debug:
  client-team-packets: false
