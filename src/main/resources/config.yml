update-interval-ticks: 40

tab:
  enabled: true
  header:
    - "<gradient:#63d471:#233329><bold>Hippo Network</bold></gradient>"
    - "&7Welcome, &f%player_name%"
  footer:
    - "&7Online: &f%server_online%"
    - "&7Store: <yellow>store.example.com</yellow>"
  player-list-name: "%vaultunlocked_prefix% &f%player_name%"
  # If this placeholder/text resolves to true/1/yes/on for a player, that player is hidden from tab list.
  # Example: "%hippostaff_isvanished%"
  hide-player-if: ""

sorting:
  enabled: true
  rank-placeholder: "%vaultunlocked_weight%"
  descending: false
  default-rank: 0

nametag:
  enabled: true
  # When false, HippoTab will never add/remove players to scoreboard teams.
  # This avoids client crashes caused by team packet desync, but nametags only
  # work for players already assigned to this plugin's team.
  auto-assign-team: true
  # Update interval in ticks (20 ticks = 1 second)
  update-interval-ticks: 40
  # Prefix shows BEFORE the player name
  # Example: "%vaultunlocked_prefix%", "<gold>[VIP] ", "<gradient:#FF0000:#00FF00>%player_rank%</gradient> "
  # Player name color uses the LAST color token found in this prefix.
  prefix: "%vaultunlocked_prefix%"
  # Suffix shows AFTER the player name
  # Suffix text does not control the player name color.
  suffix: ""
  # Full name format split by %player_name%.
  # Example: "%player_name% placehodlers"
  # If %player_name% is missing, the whole value is treated as prefix.
  name-format: "%player_name%"
  # PacketEvents username replacement for overhead nametag middle text.
  # This is separate from prefix/suffix and requires PacketEvents.
  replace-username:
    enabled: false
    format: "%player_name%"
  # Optional: disable in specific conditions
  # Examples: "world=lobby" or "%arena%=['beast','diamond']" or "world=pvp;%game_mode%=['survival']"
  disable-if: ""

belowname:
  enabled: true
  # Update interval in ticks (20 ticks = 1 second)
  update-interval-ticks: 20
  # Static objective title shown above the below-name value.
  title: "<red>❤"
  # Numeric fallback value (still required by scoreboard internals).
  value: "%player_health%"
  # Fancy text value shown instead of the raw number on modern Paper versions.
  fancy-value: "<red>%player_health%"
  # Used when fancy-value resolves to empty.
  fancy-value-default: "<gray>NPC"
  # Optional: disable in specific conditions
  disable-condition: ""

scoreboard:
  enabled: false
  # Update interval in ticks (20 ticks = 1 second)
  update-interval-ticks: 20
  # Hide the right-side score number column
  hide-number: false
  title: " Hippo Network "
  lines:
    - ""
    - " Testing FFA scoreboard "
    - ""
    - " danielchen.me "

redis-sync:
  enabled: false
  host: "127.0.0.1"
  port: 6379
  username: ""
  password: ""
  database: 0
  key-prefix: "hippotab:tab-sync"
  # Leave blank to auto-use this server port (server-25565, etc)
  server-id: ""
  # Redis publish + fetch interval in ticks.
  publish-interval-ticks: 40
  # How long each server entry stays alive if it stops publishing.
  entry-ttl-seconds: 30
  # Optional: validate synced players against a Velocity-published registry in Redis.
  velocity-registry:
    enabled: false
    # Set key of online proxy players. Members must be UUID strings.
    online-set-key: "hippotab:velocity:online"
    # Hash key of proxy player profiles. field=UUID, value=base64(name)|base64(prefixMiniMessage)|base64(weight)|base64(perm1,perm2,...)
    profiles-hash-key: "hippotab:velocity:profiles"
    # When true, a synced player is dropped if profile entry is missing.
    require-profile: true
    # Optional permission that must exist in proxy profile perms to allow tab sync.
    required-permission: ""
    # If true, team prefix is overridden from proxy profile prefix.
    use-profile-prefix-for-team: true
    # If true, list sorting order uses proxy profile weight.
    use-profile-weight-for-sorting: true
  # Team packet sync for remote entries (prefix/suffix/color via scoreboard teams).
  # Disable this to avoid client "Network Protocol Error" caused by team packet conflicts.
  team-sync:
    enabled: false
    # If true, packet exceptions while syncing teams are ignored.
    ignore-packet-errors: true

debug:
  # Logs every outgoing HippoTab team packet seen by PacketEvents.
  # Use this to verify whether the client is still being sent ht_* remove packets.
  client-team-packets: false
